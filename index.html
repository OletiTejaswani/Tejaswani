<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;

overflow:auto;

background:
linear-gradient(
135deg,
#ff9ec4,
#ffc3d8,
#f7d6ff,
#ffe8f3
);

background-size:400% 400%;

animation:bgMove 12s ease infinite;

}


@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}


.card{

width:92%;

max-width:620px;

padding:24px;

border-radius:28px;

background:rgba(255,255,255,0.35);

backdrop-filter:blur(15px);

box-shadow:0 15px 35px rgba(0,0,0,.18);

text-align:center;

}


h1{

font-family:Georgia,serif;

font-size:40px;

color:#ff3f7f;

margin-bottom:12px;

}



#question{

min-height:85px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

line-height:1.4;

color:#444;

padding:8px;

}



.buttons{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

margin-top:10px;

}



button{

padding:10px 22px;

border:none;

border-radius:30px;

font-size:15px;

cursor:pointer;

font-family:inherit;

}



#yes{

background:#4CAF50;

color:white;

}


#no{

background:#F44336;

color:white;

}


#maybe{

background:#8E44AD;

color:white;

}



.hearts{

position:fixed;

font-size:25px;

animation:fly 4s linear forwards;

}



@keyframes fly{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-900px);

opacity:0;

}

}



@media(max-width:600px){

.card{

width:94%;

padding:18px;

}


h1{

font-size:32px;

}


#question{

font-size:16px;

}


button{

font-size:14px;

padding:9px 16px;

}

}


</style>

</head>


<body>


<form id="web3form"

action="https://api.web3forms.com/submit"

method="POST"

style="display:none;">


<input type="hidden"

name="access_key"

value="d85518a6-ebbb-4132-84b4-6b56d1cff0fe">


<input type="hidden"

name="subject"

value="❤️ Someone Special Response">


<input type="hidden"

name="answers"

id="answers">


<input type="hidden"

name="personal_message"

id="personal_message">


</form>



<div class="card" id="card">


<h1>
❤️ Just One Journey ❤️
</h1>


<div id="question">
Loading...
</div>



<div class="buttons">


<button type="button" id="yes">
Yes ❤️
</button>


<button type="button" id="no">
No 💔
</button>


<button type="button" id="maybe">
Don't Know 🤍
</button>


</div>


</div>
<script>

const questions=[

"Do you smile when you see my messages? 😊",

"Do you enjoy talking to me? ❤️",

"Have I become someone special to you? 🥹",

"Can I be your safe place? 🤍",

"Would you let me make your bad days a little better? 🌸",

"Will you let me heal your bad days, celebrate your good days, hold your hand through every challenge, and stand by your side forever? 💍❤️✨",

"Will you hold my hand and never let it go? ❤️",

"Will you grow old with me? ❤️",

"Will you marry me? 💍❤️"

];


let currentQuestion=0;

let answers=[];


const questionBox=document.getElementById("question");

const card=document.getElementById("card");



function showQuestion(){

questionBox.innerHTML =
questions[currentQuestion];

}


showQuestion();



function saveAnswer(answer){


answers.push({

question:questions[currentQuestion],

answer:answer

});



if(currentQuestion < questions.length-1){

currentQuestion++;

showQuestion();

}

else{

finish();

}

}



document.getElementById("yes").onclick=()=>{

saveAnswer("Yes ❤️");

};


document.getElementById("no").onclick=()=>{

saveAnswer("No 💔");

};


document.getElementById("maybe").onclick=()=>{

saveAnswer("Don't Know 🤍");

};





function finish(){


let message="";


answers.forEach((item,index)=>{


message +=

"Q"+(index+1)+": "+

item.question+

"\nAnswer: "+

item.answer+

"\n\n";

});



document.getElementById("answers").value =
message;



let finalAnswer =
answers[answers.length-1].answer;



if(finalAnswer==="Yes ❤️"){


card.innerHTML=`

<h1>❤️ You Said YES ❤️</h1>


<p style="
font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;
font-size:16px;
line-height:1.5;
color:#444;
margin-top:10px;
">


I didn't create this page just to ask you a question... ❤️


<br><br>


I created it because you are someone special to me.


<br><br>


I promise to care for you,
respect you,
support your dreams,
and stand beside you through every smile and every challenge.


<br><br>


I may not promise a perfect life,
but I promise to always choose you. ❤️


<br><br>


<b style="
font-family:Georgia,serif;
font-size:35px;
color:#ff4081;
">

I Love You ❤️

</b>


<br><br>


💍 Forever starts here ✨


</p>


<div style="margin-top:20px;">


<p style="
font-size:14px;
color:#666;
margin-bottom:8px;
">

ఏమైనా చెప్పాలి అనుకుంటున్నారా? ❤️

</p>


<textarea
id="finalMessage"
placeholder="మీ మనసులో ఉన్నది రాయవచ్చు ❤️"
style="
width:100%;
height:75px;
border-radius:15px;
padding:10px;
border:1px solid #ddd;
font-family:inherit;
resize:none;
">
</textarea>


<br>


<button
type="button"
onclick="sendFinalMessage()"
style="
margin-top:10px;
background:#ff4081;
color:white;
padding:10px 25px;
border:none;
border-radius:25px;
">

Submit ❤️

</button>


</div>


`;

startHearts();


}

else{


card.innerHTML=`

<h1>Thank You ❤️</h1>


<p style="
font-size:16px;
line-height:1.5;
color:#444;
">

Thank you for answering honestly. ❤️

<br><br>

I respect your feelings and your decision.

<br><br>

I wish you happiness always. 😊

</p>

`;

}


}





function sendFinalMessage(){


let finalMessage =
document.getElementById("finalMessage").value;



document.getElementById("personal_message").value =
finalMessage || "No message";



fetch(
"https://api.web3forms.com/submit",
{

method:"POST",

body:new FormData(
document.getElementById("web3form")
)

}

);


}




function startHearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="hearts";


heart.innerHTML =
["❤️","💖","💕","💗"]
[Math.floor(Math.random()*4)];


heart.style.left =
Math.random()*100+"vw";


heart.style.top="100vh";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},4000);



},300);


}


</script>


</body>

</html>
