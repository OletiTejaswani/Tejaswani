<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;

overflow:hidden;

background:linear-gradient(
135deg,
#ff9ec4,
#ffc3d8,
#f7d6ff,
#ffe8f3
);

background-size:400% 400%;
animation:bgMove 12s ease infinite;

}


@keyframes bgMove{

0%{background-position:0% 50%}

50%{background-position:100% 50%}

100%{background-position:0% 50%}

}



.card{

width:92%;
max-width:600px;

padding:22px;

border-radius:25px;

background:rgba(255,255,255,0.35);

backdrop-filter:blur(15px);

box-shadow:0 15px 35px rgba(0,0,0,.18);

text-align:center;

}



h1{

font-family:Georgia,serif;

font-size:38px;

color:#ff3f7f;

margin-bottom:10px;

}



#question{

min-height:80px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

line-height:1.35;

color:#444;

padding:8px;

text-align:center;

}



.buttons{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

margin-top:8px;

}



button{

padding:10px 20px;

border:none;

border-radius:25px;

font-size:15px;

cursor:pointer;

font-family:inherit;

}



#yes{

background:#4CAF50;

color:white;

}


#no{

background:#F44336;

color:white;

}


#maybe{

background:#8E44AD;

color:white;

}



.messageBox{

margin-top:15px;

}


.messageBox p{

font-size:14px;

color:#666;

margin-bottom:6px;

}



textarea{

width:100%;

height:65px;

border:none;

border-radius:15px;

padding:10px;

font-family:inherit;

font-size:14px;

resize:none;

outline:none;

}



.hearts{

position:fixed;

font-size:24px;

animation:fly 4s linear forwards;

}



@keyframes fly{

from{

transform:translateY(0);

opacity:1;

}

to{

transform:translateY(-900px);

opacity:0;

}

}



@media(max-width:600px){

.card{

width:94%;

padding:18px;

}


h1{

font-size:32px;

}


#question{

font-size:16px;

}


button{

font-size:14px;

padding:9px 16px;

}

}

</style>

</head>


<body>


<form id="web3form"
action="https://api.web3forms.com/submit"
method="POST"
style="display:none;">


<input type="hidden"
name="access_key"
value="d85518a6-ebbb-4132-84b4-6b56d1cff0fe">


<input type="hidden"
name="subject"
value="❤️ Someone Special Response">


<input type="hidden"
name="answers"
id="answers">


<input type="hidden"
name="personal_message"
id="personal_message">


</form>



<div class="card" id="card">


<h1>
❤️ Just One Journey ❤️
</h1>


<div id="question">
Loading...
</div>



<div class="buttons">


<button type="button" id="yes">
Yes ❤️
</button>


<button type="button" id="no">
No 💔
</button>


<button type="button" id="maybe">
Don't Know 🤍
</button>


</div>



<div class="messageBox">

<p>
Anything you want to share? ❤️
</p>


<textarea 
id="userMessage"
placeholder="Write your thoughts here...">
</textarea>


</div>


</div>
  <script>

const questions=[

"Do you smile when you see my messages? 😊",

"Do you enjoy talking to me? ❤️",

"Have I become someone special to you? 🥹",

"Can I be your safe place? 🤍",

"Would you let me make your bad days a little better? 🌸",

"Will you let me heal your bad days, celebrate your good days, hold your hand through every challenge, and stand by your side forever? 💍❤️✨",

"Will you hold my hand and never let it go? ❤️",

"Will you grow old with me? ❤️",

"Will you marry me? 💍❤️"

];


let currentQuestion=0;

let answers=[];


const questionBox=document.getElementById("question");

const card=document.getElementById("card");



function showQuestion(){

questionBox.innerHTML =
questions[currentQuestion];

}


showQuestion();



function saveAnswer(answer){


answers.push({

question:questions[currentQuestion],

answer:answer

});



if(currentQuestion < questions.length-1){

currentQuestion++;

showQuestion();

}

else{

finish();

}


}



document.getElementById("yes").onclick=function(){

saveAnswer("Yes ❤️");

};


document.getElementById("no").onclick=function(){

saveAnswer("No 💔");

};


document.getElementById("maybe").onclick=function(){

saveAnswer("Don't Know 🤍");

};





function finish(){


let message="";


answers.forEach((item,index)=>{


message +=

"Q"+(index+1)+": "+

item.question+

"\nAnswer: "+

item.answer+

"\n\n";


});



let userMessage =
document.getElementById("userMessage").value;



message +=

"Anything you want to share: "

+

userMessage;



document.getElementById("answers").value =
message;


document.getElementById("personal_message").value =
userMessage || "No message";



fetch(
"https://api.web3forms.com/submit",
{

method:"POST",

body:new FormData(
document.getElementById("web3form")
)

}

);



let finalAnswer =
answers[answers.length-1].answer;



if(finalAnswer==="Yes ❤️"){


card.innerHTML=`

<h1>❤️ You Said YES ❤️</h1>


<p style="
font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;
font-size:16px;
line-height:1.5;
color:#444;
margin-top:10px;
">


I didn't create this page just to ask a question... ❤️


<br><br>


I created it because you are someone special to me.


<br><br>


I promise to care for you,
respect you,
support your dreams,
and stand beside you through every moment.


<br><br>


I may not promise a perfect life,
but I promise to always choose you. ❤️


<br><br>


<b style="
font-family:Georgia,serif;
font-size:35px;
color:#ff4081;
">

I Love You ❤️

</b>


<br><br>


💍 Forever starts here ✨


</p>

`;


startHearts();


}

else{


card.innerHTML=`

<h1>Thank You ❤️</h1>


<p style="
font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;
font-size:16px;
line-height:1.5;
color:#444;
">


Thank you for answering honestly. ❤️


<br><br>


I respect your feelings and your decision.


<br><br>


I wish you happiness always. 😊


</p>

`;

}


}



function startHearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="hearts";


heart.innerHTML =
["❤️","💖","💕","💗"]
[Math.floor(Math.random()*4)];


heart.style.left =
Math.random()*100+"vw";


heart.style.top="100vh";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},4000);



},300);


}


</script>


</body>

</html>
