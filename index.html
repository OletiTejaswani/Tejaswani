<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#ff9ec4,
#ffc3d8,
#f7d6ff,
#ffe8f3
);

background-size:400% 400%;

animation:bgMove 12s infinite;

}


@keyframes bgMove{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}


.card{

width:92%;

max-width:620px;

padding:30px;

border-radius:28px;

background:rgba(255,255,255,0.32);

backdrop-filter:blur(18px);

box-shadow:0 20px 45px rgba(0,0,0,.18);

text-align:center;

}


h1{

font-family:'Great Vibes',cursive;

font-size:48px;

color:#ff3f7f;

margin-bottom:15px;

}


#question{

min-height:110px;

display:flex;

justify-content:center;

align-items:center;

font-size:21px;

line-height:1.5;

color:#444;

transition:.3s;

}


.buttons{

display:flex;

justify-content:center;

gap:12px;

flex-wrap:wrap;

margin-top:15px;

}


button{

padding:12px 24px;

border:none;

border-radius:30px;

font-size:16px;

cursor:pointer;

font-family:'Poppins',sans-serif;

transition:.3s;

}


button:hover{

transform:scale(1.05);

}


#yes{

background:#4CAF50;

color:white;

}


#no{

background:#F44336;

color:white;

}


#maybe{

background:#8E44AD;

color:white;

}


.hearts{

position:fixed;

font-size:25px;

animation:fly 4s linear forwards;

}


@keyframes fly{

from{

transform:translateY(0);

opacity:1;

}

to{

transform:translateY(-900px);

opacity:0;

}

}



@media(max-width:600px){

.card{

padding:22px;

}

h1{

font-size:38px;

}

#question{

font-size:18px;

min-height:90px;

}

button{

font-size:14px;

padding:11px 18px;

}

}


</style>

</head>


<body>


<form id="web3form"

action="https://api.web3forms.com/submit"

method="POST"

style="display:none;">


<input type="hidden"
name="access_key"
value="d85518a6-ebbb-4132-84b4-6b56d1cff0fe">


<input type="hidden"
name="subject"
value="❤️ Vasu Proposal Response">


<input type="hidden"
name="answers"
id="answers">


<input type="hidden"
name="personal_message"
id="personal_message">


</form>



<div class="card" id="card">


<h1>
❤️ Just One Journey ❤️
</h1>


<div id="question">
Loading...
</div>


<div class="buttons">

<button id="yes">
Yes ❤️
</button>

<button id="no">
No 💔
</button>

<button id="maybe">
Don't Know 🤍
</button>

</div>


</div>
  <script>

const questions=[

"Do you smile when you see my messages? 😊",

"Do you enjoy talking to me? ❤️",

"Have I become someone special to you? 🥹",

"Can I be your safe place? 🤍",

"Would you let me make your bad days a little better? 🌸",

"Will you let me heal your bad days, celebrate your good days, hold your hand through every challenge, and stand by your side forever? 💍❤️✨",

"Will you hold my hand and never let it go? ❤️",

"Will you grow old with me? ❤️",

"Will you marry me? 💍❤️"

];


let currentQuestion=0;

let answers=[];


const questionBox=document.getElementById("question");

const card=document.getElementById("card");

const yes=document.getElementById("yes");

const no=document.getElementById("no");

const maybe=document.getElementById("maybe");



function showQuestion(){


questionBox.style.opacity="0";


setTimeout(()=>{

questionBox.innerHTML=
questions[currentQuestion];

questionBox.style.opacity="1";


},200);


}


showQuestion();



function saveAnswer(answer){


answers.push({

question:questions[currentQuestion],

answer:answer

});



if(currentQuestion < questions.length-1){


currentQuestion++;

showQuestion();


}

else{


finish();


}


}




yes.onclick=()=>saveAnswer("Yes ❤️");


no.onclick=()=>saveAnswer("No 💔");


maybe.onclick=()=>saveAnswer("Don't Know 🤍");





function sendResponse(){


let message="";


answers.forEach((item,index)=>{


message +=

"Q"+(index+1)+": "+

item.question+

"\nAnswer: "+

item.answer+

"\n\n";


});



document.getElementById("answers").value =
message;


fetch(
"https://api.web3forms.com/submit",
{

method:"POST",

body:new FormData(
document.getElementById("web3form")
)

}

);


}
  function finish(){


let userMessage = prompt(
"Anything you want to say? ❤️"
);


document.getElementById("personal_message").value =
userMessage || "No additional message";



sendResponse();



let finalAnswer =
answers[answers.length-1].answer;



if(finalAnswer==="Yes ❤️"){


card.innerHTML=`

<h1>❤️ You Said YES ❤️</h1>


<p style="
font-size:16px;
line-height:1.55;
color:#444;
max-width:520px;
margin:12px auto;
text-align:center;
">


I didn't create this page just to ask you a question... ❤️

<br><br>

I created it because you are someone special to me.


<br><br>

I promise to care for you,
respect you,
support your dreams,
and stand beside you through every smile and every challenge.


<br><br>

I may not promise a perfect life,
but I promise to choose you,
understand you,
and always try to make you happy. ❤️


<br><br>

Thank you for choosing me.


<br><br>


<span style="
font-family:'Great Vibes',cursive;
font-size:40px;
color:#ff4081;
">

I Love You Vasu ❤️

</span>


<br><br>


💍 Forever starts here ✨


</p>

`;


startHearts();


}


else{


card.innerHTML=`

<h1>Thank You ❤️</h1>


<p style="
font-size:16px;
line-height:1.6;
color:#444;
max-width:520px;
margin:auto;
">


Thank you for answering honestly. ❤️


<br><br>


I respect your feelings and your decision.


<br><br>


I wish you happiness,
peace and success always.


<br><br>


Keep smiling 😊


</p>

`;

}


}




function startHearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="hearts";


heart.innerHTML=

["❤️","💖","💕","💗"]

[Math.floor(Math.random()*4)];


heart.style.left =
Math.random()*100+"vw";


heart.style.top="100vh";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},4000);



},300);


}


</script>


</body>

</html>
