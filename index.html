<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:linear-gradient(
135deg,
#ff9ec4,
#ffc3d8,
#ffd6e7,
#f7d6ff
);

background-size:400% 400%;
animation:bgMove 12s infinite;
}


@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}


.card{

width:90%;
max-width:700px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,.25);

backdrop-filter:blur(18px);

box-shadow:0 20px 45px rgba(0,0,0,.2);

text-align:center;

}


h1{
color:#ff3f7f;
margin-bottom:20px;
}


#question{

font-size:25px;
line-height:1.6;
color:#444;

min-height:120px;

display:flex;
align-items:center;
justify-content:center;

}


.buttons{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}


button{

padding:14px 28px;

border:none;

border-radius:35px;

font-size:18px;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:scale(1.08);

}


#yes{

background:#4CAF50;
color:white;

}


#no{

background:#F44336;
color:white;

}


#maybe{

background:#8E44AD;
color:white;

}


.hearts{

position:fixed;

font-size:28px;

animation:fly 4s linear forwards;

}


@keyframes fly{

from{
transform:translateY(0);
opacity:1;
}

to{
transform:translateY(-900px);
opacity:0;
}

}

</style>

</head>


<body>


<form id="web3form"
action="https://api.web3forms.com/submit"
method="POST"
style="display:none;">


<input type="hidden"
name="access_key"
value="d85518a6-ebbb-4132-84b4-6b56d1cff0fe">


<input type="hidden"
name="subject"
value="❤️ Vasu Proposal Response">


<input type="hidden"
name="answers"
id="answers">


</form>


<div class="card" id="card">


<h1>❤️ Just One Journey ❤️</h1>


<div id="question"></div>


<div class="buttons">

<button id="yes">Yes ❤️</button>

<button id="no">No 💔</button>

<button id="maybe">Don't Know 🤍</button>

</div>


</div>
  <script>

const questions=[

"Do you smile when you see my messages? 😊",

"Do you enjoy talking to me? ❤️",

"Have I become someone special to you? 🥹",

"Can I be your safe place? 🤍",

"Would you let me make your bad days a little better? 🌸",

"Will you let me heal your bad days, celebrate your good days, hold your hand through every challenge, and stand by your side forever? 💍❤️✨",

"Will you hold my hand and never let it go? ❤️",

"Will you grow old with me? ❤️",

"Will you marry me? 💍❤️"

];


let current=0;

let answers=[];


const question=document.getElementById("question");

const yes=document.getElementById("yes");

const no=document.getElementById("no");

const maybe=document.getElementById("maybe");


function load(){

question.innerHTML=questions[current];

}

load();



function save(answer){


answers.push({

question:questions[current],

answer:answer

});


if(current < questions.length-1){

current++;

load();

}

else{

sendResult();

}


}



yes.onclick=()=>save("Yes ❤️");

no.onclick=()=>save("No 💔");

maybe.onclick=()=>save("Don't Know 🤍");




function sendResult(){


let text="";


answers.forEach((a,i)=>{

text+=
"Q"+(i+1)+": "+a.question+
"\nAnswer: "+a.answer+
"\n\n";

});


document.getElementById("answers").value=text;

fetch("https://api.web3forms.com/submit", {
    method: "POST",
    body: new FormData(document.getElementById("web3form"))
})
.then(response => response.json())
.then(data => {
    console.log("Response sent");
});



let finalAnswer=
answers[answers.length-1].answer;



if(finalAnswer==="Yes ❤️"){


document.getElementById("card").innerHTML=`

<h1>❤️ You Said YES ❤️</h1>


<p style="font-size:20px;line-height:1.8;color:#444">


I didn't create this page just to ask a question...

I created it because I wanted you to know how special you are to me. ❤️


<br><br>


I promise to respect you,

support your dreams,

stand beside you through every challenge,

and choose you every single day.


<br><br>


No relationship is perfect,

but with understanding, trust and care,

we can create something beautiful together.


<br><br>


Thank you for choosing me ❤️


<br><br>


<b style="font-size:28px;color:#ff4081">

I Love You Vasu ❤️

</b>


<br><br>


💍 Forever starts here ✨


</p>

`;


startHearts();


}


else{


document.getElementById("card").innerHTML=`

<h1>Thank You ❤️</h1>


<p style="font-size:20px;line-height:1.8;color:#444">


Thank you for answering honestly. ❤️


<br><br>


I respect your feelings and your decision.


No matter what,

I wish you happiness, peace and success always.


<br><br>


Keep smiling 😊


</p>

`;

}


}




function startHearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="hearts";


heart.innerHTML=
["❤️","💖","💕","💗"]
[Math.floor(Math.random()*4)];


heart.style.left=Math.random()*100+"vw";


heart.style.top="100vh";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},4000);



},300);


}


</script>


</body>

</html>
