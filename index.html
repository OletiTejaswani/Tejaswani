<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:
linear-gradient(
135deg,
#ff9ec4,
#ffc3d8,
#f7d6ff,
#ffe8f3
);

background-size:400% 400%;

animation:bgMove 12s ease infinite;

font-family:'Poppins',sans-serif;

}


@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}


.card{

width:90%;

max-width:650px;

padding:35px;

border-radius:30px;

background:rgba(255,255,255,0.30);

backdrop-filter:blur(18px);

box-shadow:
0 20px 45px rgba(0,0,0,.18);

text-align:center;

animation:fade .8s ease;

}


@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}


h1{

font-family:'Great Vibes',cursive;

font-size:55px;

color:#ff3f7f;

margin-bottom:20px;

}



#question{

min-height:120px;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

line-height:1.7;

font-weight:500;

color:#444;

transition:.3s;

}



.buttons{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

margin-top:20px;

}



button{

padding:13px 25px;

border:none;

border-radius:35px;

font-size:17px;

cursor:pointer;

font-family:'Poppins',sans-serif;

transition:.3s;

}


button:hover{

transform:scale(1.08);

}



#yes{

background:#4CAF50;

color:white;

}


#no{

background:#F44336;

color:white;

}


#maybe{

background:#8E44AD;

color:white;

}



.hearts{

position:fixed;

font-size:28px;

pointer-events:none;

animation:fly 4s linear forwards;

}



@keyframes fly{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-900px);

opacity:0;

}

}



/* Mobile */

@media(max-width:600px){


.card{

width:92%;

padding:25px;

}


h1{

font-size:42px;

}


#question{

font-size:19px;

min-height:100px;

}


button{

font-size:15px;

padding:12px 18px;

}


}


</style>

</head>


<body>


<form id="web3form"

action="https://api.web3forms.com/submit"

method="POST"

style="display:none;">


<input type="hidden"

name="access_key"

value="d85518a6-ebbb-4132-84b4-6b56d1cff0fe">


<input type="hidden"

name="subject"

value="❤️ Vasu Proposal Response">


<input type="hidden"

name="answers"

id="answers">


<input type="hidden"

name="personal_message"

id="personal_message">


</form>



<div class="card" id="card">


<h1>
❤️ Just One Journey ❤️
</h1>


<div id="question">

Loading...

</div>


<div class="buttons">


<button id="yes">
Yes ❤️
</button>


<button id="no">
No 💔
</button>


<button id="maybe">
Don't Know 🤍
</button>


</div>


</div>
<script>

const questions=[

"Do you smile when you see my messages? 😊",

"Do you enjoy talking to me? ❤️",

"Have I become someone special to you? 🥹",

"Can I be your safe place? 🤍",

"Would you let me make your bad days a little better? 🌸",

"Will you let me heal your bad days, celebrate your good days, hold your hand through every challenge, and stand by your side forever? 💍❤️✨",

"Will you hold my hand and never let it go? ❤️",

"Will you grow old with me? ❤️",

"Will you marry me? 💍❤️"

];


let currentQuestion=0;

let answers=[];


const questionBox=document.getElementById("question");

const card=document.getElementById("card");

const yes=document.getElementById("yes");

const no=document.getElementById("no");

const maybe=document.getElementById("maybe");



function showQuestion(){

questionBox.style.opacity=0;


setTimeout(()=>{

questionBox.innerHTML=
questions[currentQuestion];

questionBox.style.opacity=1;


},200);


}


showQuestion();



function saveAnswer(answer){


answers.push({

question:questions[currentQuestion],

answer:answer

});



if(currentQuestion < questions.length-1){


currentQuestion++;

showQuestion();


}

else{


finish();


}


}



yes.onclick=()=>{

saveAnswer("Yes ❤️");

};


no.onclick=()=>{

saveAnswer("No 💔");

};


maybe.onclick=()=>{

saveAnswer("Don't Know 🤍");

};



function sendResponse(){


let message="";


answers.forEach((item,index)=>{


message+=

"Q"+(index+1)+": "+

item.question+

"\nAnswer: "+

item.answer+

"\n\n";


});


document.getElementById("answers").value=message;



fetch(

"https://api.web3forms.com/submit",

{

method:"POST",

body:new FormData(

document.getElementById("web3form")

)

}

);


}
  function finish(){


let userMessage = prompt(
"Anything you want to say? ❤️"
);


document.getElementById("personal_message").value =
userMessage || "No additional message";



sendResponse();



let finalAnswer =
answers[answers.length-1].answer;



if(finalAnswer==="Yes ❤️"){


card.innerHTML=`

<h1>❤️ You Said YES ❤️</h1>


<p style="
font-size:18px;
line-height:1.8;
color:#444;
max-width:550px;
margin:auto;
">


I didn't create this page just to ask a question... ❤️


<br><br>


I created it because you are someone special to me.


<br><br>


I promise to care for you,
respect you,
support your dreams,
and stand beside you through every smile and every challenge.


<br><br>


I may not promise a perfect life,
but I promise to choose you,
understand you,
and always keep trying to make you happy. ❤️


<br><br>


Thank you for choosing me.


<br><br>


<span style="
font-family:'Great Vibes',cursive;
font-size:45px;
color:#ff4081;
">

I Love You Vasu ❤️

</span>


<br><br>


💍 Forever starts here ✨


</p>

`;


startHearts();


}



else{


card.innerHTML=`

<h1>Thank You ❤️</h1>


<p style="
font-size:18px;
line-height:1.8;
color:#444;
max-width:550px;
margin:auto;
">


Thank you for answering honestly. ❤️


<br><br>


I respect your feelings and your decision.


<br><br>


No matter what,
I wish you happiness,
peace and success always.


<br><br>


Keep smiling 😊


</p>

`;

}


}




function startHearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="hearts";


heart.innerHTML=

["❤️","💖","💕","💗"]

[Math.floor(Math.random()*4)];


heart.style.left=
Math.random()*100+"vw";


heart.style.top="100vh";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},4000);



},300);


}



</script>


</body>

</html>
