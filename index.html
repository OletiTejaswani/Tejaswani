<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;

background:
linear-gradient(
135deg,
#ff9ec4,
#ffc3d8,
#f7d6ff,
#ffe8f3
);

background-size:400% 400%;

animation:bgMove 12s ease infinite;

}


@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}



.card{

width:92%;

max-width:600px;

padding:24px;

border-radius:25px;

background:rgba(255,255,255,0.32);

backdrop-filter:blur(15px);

box-shadow:0 15px 35px rgba(0,0,0,.18);

text-align:center;

}



h1{

font-size:38px;

color:#ff3f7f;

margin-bottom:8px;

font-family:'Georgia',serif;

}



#question{

min-height:85px;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

line-height:1.35;

font-weight:500;

color:#444;

padding:8px;

text-align:center;

transition:.3s;

}



.buttons{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

margin-top:10px;

}



button{

padding:10px 20px;

font-size:15px;

border:none;

border-radius:25px;

cursor:pointer;

font-family:inherit;

transition:.3s;

}



button:hover{

transform:scale(1.05);

}



#yes{

background:#4CAF50;

color:white;

}


#no{

background:#F44336;

color:white;

}


#maybe{

background:#8E44AD;

color:white;

}



.hearts{

position:fixed;

font-size:24px;

animation:fly 4s linear forwards;

}



@keyframes fly{

0%{

transform:translateY(0);

opacity:1;

}

100%{

transform:translateY(-900px);

opacity:0;

}

}



@media(max-width:600px){

.card{

width:94%;

padding:20px;

}


h1{

font-size:32px;

}


#question{

font-size:16px;

min-height:75px;

}


button{

font-size:14px;

padding:9px 16px;

}

}


</style>

</head>


<body>


<form id="web3form"
action="https://api.web3forms.com/submit"
method="POST"
style="display:none;">


<input type="hidden"
name="access_key"
value="d85518a6-ebbb-4132-84b4-6b56d1cff0fe">


<input type="hidden"
name="subject"
value="❤️ Vasu Proposal Response">


<input type="hidden"
name="answers"
id="answers">


</form>


<div class="card" id="card">


<h1>❤️ Just One Journey ❤️</h1>


<div id="question">
Loading...
</div>


<div class="buttons">

<button id="yes">
Yes ❤️
</button>


<button id="no">
No 💔
</button>


<button id="maybe">
Don't Know 🤍
</button>

</div>


</div>
  <script>

const questions=[

"Do you smile when you see my messages? 😊",

"Do you enjoy talking to me? ❤️",

"Have I become someone special to you? 🥹",

"Can I be your safe place? 🤍",

"Would you let me make your bad days a little better? 🌸",

"Will you let me heal your bad days, celebrate your good days, hold your hand through every challenge, and stand by your side forever? 💍❤️✨",

"Will you hold my hand and never let it go? ❤️",

"Will you grow old with me? ❤️",

"Will you marry me? 💍❤️"

];


let current=0;

let answers=[];


const question=document.getElementById("question");

const card=document.getElementById("card");

const yes=document.getElementById("yes");

const no=document.getElementById("no");

const maybe=document.getElementById("maybe");



function showQuestion(){

question.innerHTML=questions[current];

}


showQuestion();



function saveAnswer(answer){


answers.push({

question:questions[current],

answer:answer

});



if(current < questions.length-1){

current++;

showQuestion();

}

else{

finish();

}


}



yes.onclick=()=>saveAnswer("Yes ❤️");

no.onclick=()=>saveAnswer("No 💔");

maybe.onclick=()=>saveAnswer("Don't Know 🤍");





function finish(){


let message="";


answers.forEach((item,index)=>{

message+=
"Q"+(index+1)+": "+
item.question+
"\nAnswer: "+
item.answer+
"\n\n";

});



document.getElementById("answers").value=message;



fetch(
"https://api.web3forms.com/submit",
{

method:"POST",

body:new FormData(
document.getElementById("web3form")
)

}

);



let finalAnswer=
answers[answers.length-1].answer;



if(finalAnswer==="Yes ❤️"){


card.innerHTML=`

<h1>❤️ Yes ❤️</h1>


<p style="
font-family:'Aptos Narrow','Arial Narrow',Arial,sans-serif;
font-size:16px;
line-height:1.5;
color:#444;
margin-top:10px;
">


I didn't create this page just to ask a question... ❤️

<br><br>

I created it because you are special to me.

<br><br>

I promise to care for you,
respect you,
support you,
and stand beside you through every moment.

<br><br>

I may not promise a perfect life,
but I promise to always choose you. ❤️

<br><br>

<b style="
font-family:Georgia,serif;
font-size:35px;
color:#ff4081;
">

I Love You Vasu ❤️

</b>


<br><br>

💍 Forever starts here

</p>

`;

startHearts();


}

else{


card.innerHTML=`

<h1>Thank You ❤️</h1>


<p style="
font-size:16px;
line-height:1.5;
color:#444;
">


Thank you for answering honestly. ❤️

<br><br>

I respect your feelings and your decision.

<br><br>

I wish you happiness always. 😊

</p>

`;

}


}




function startHearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="hearts";


heart.innerHTML=
["❤️","💖","💕","💗"]
[Math.floor(Math.random()*4)];


heart.style.left=Math.random()*100+"vw";


heart.style.top="100vh";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},4000);


},300);


}


</script>


</body>

</html>
